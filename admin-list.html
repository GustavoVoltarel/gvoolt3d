<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciar Produtos | GVolt 3D</title>
    <meta
      name="description"
      content="Lista de anúncios para editar, pausar ou reativar."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!-- Usa o mesmo arquivo de estilos que o restante do site -->
    <link rel="stylesheet" href="style.css" />
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      /* Estilos adicionais para a listagem */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 24px;
      }
      thead {
        background: var(--card-solid);
      }
      th,
      td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }
      tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.03);
      }
      .actions {
        display: flex;
        gap: 12px;
      }
      .actions a {
        color: var(--purple);
        cursor: pointer;
        text-decoration: none;
      }
      .actions a:hover {
        text-decoration: underline;
      }
    </style>
    <link rel="stylesheet" href="cyberpunk.css" />
    <link rel="stylesheet" href="admin-cyberpunk.css" />
    <meta name="theme-color" content="#080e15" />
  </head>
  <body class="admin-interface">
    <div class="site-glow"></div>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="GVolt 3D">
        <!-- Usa a nova logo do site -->
        <img
          src="assets/logo-gvolt-gv.webp"
          alt="Logo GVolt 3D"
        />
        <span>GVolt <strong>3D</strong></span>
      </a>
      <nav class="nav-links" aria-label="Navegação principal">
        <a href="admin-dashboard.html">Gestão</a>
        <a href="index.html">Início</a>
        <a href="index.html#produtos">Produtos</a>
        <a href="index.html#contato">Contato</a>
      </nav>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span aria-hidden="true">☰</span>
      </button>
    </header>
    <main class="admin-page">
      <h2>Gerenciar Produtos</h2>
      <!-- Área de login -->
      <div id="login-container">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" placeholder="seu@email.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" placeholder="Senha" />
        </div>
        <button class="btn btn-primary" id="login-button">Entrar</button>
        <p id="login-message" class="message error" hidden></p>
      </div>

      <!-- Área de listagem -->
      <div id="list-container" hidden>
        <p>Anúncios publicados e pausados:</p>
        <div class="product-admin-toolbar">
          <label for="product-status-filter">Exibir anúncios</label>
          <select id="product-status-filter"><option value="all">Todos</option><option value="active">Publicados</option><option value="paused">Pausados</option></select>
          <span id="product-status-count" class="product-admin-count" aria-live="polite"></span>
        </div>
        <table id="products-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Preço</th>
              <th>Disponibilidade</th>
              <th>Anúncio</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="products-body">
            <!-- Conteúdo dinâmico -->
          </tbody>
        </table>
        <p id="list-message" class="message" hidden></p>
        <button class="btn btn-secondary" id="logout-button">Sair</button>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-brand">
        <!-- Usa a nova logo do site -->
        <img
          src="assets/logo-gvolt-gv.webp"
          alt="Logo GVolt 3D"
        />
        <strong>GVolt <span>3D</span></strong>
      </div>
      <p>Soluções criativas em impressão 3D.</p>
      <a href="https://wa.me/5519995325891" target="_blank"
        ><i class="fa-brands fa-whatsapp"></i> Fale conosco</a
      >
    </footer>
    <script>
      // Altere estas constantes para suas credenciais
      const SUPABASE_URL = "https://ztrzwaosybnmzwjufqld.supabase.co";
      const SUPABASE_KEY = "sb_publishable_oKFgxOaFvi21vRGpymMKOg_Z26OATE6";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
      );
      const ADMIN_EMAILS = ["g.voltarel95@gmail.com"]; // ajuste com seus e-mails

      const loginContainer = document.getElementById("login-container");
      const listContainer = document.getElementById("list-container");
      const loginMessage = document.getElementById("login-message");
      const listMessage = document.getElementById("list-message");
      const productsBody = document.getElementById("products-body");

      async function checkSession() {
        const {
          data: {session},
        } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          if (ADMIN_EMAILS.includes(session.user.email)) {
            showList();
            await loadProducts();
          } else {
            loginContainer.hidden = false;
            listContainer.hidden = true;
            loginMessage.hidden = false;
            loginMessage.textContent =
              "Este usuário não tem permissão para acessar a área administrativa.";
          }
        } else {
          showLogin();
        }
      }

      function showLogin() {
        loginContainer.hidden = false;
        listContainer.hidden = true;
        loginMessage.hidden = true;
      }

      function showList() {
        loginContainer.hidden = true;
        listContainer.hidden = false;
        loginMessage.hidden = true;
      }

      document
        .getElementById("login-button")
        .addEventListener("click", async () => {
          const email = document.getElementById("login-email").value.trim();
          const password = document.getElementById("login-password").value;
          loginMessage.hidden = true;
          if (!email || !password) {
            loginMessage.textContent = "Preencha e-mail e senha.";
            loginMessage.hidden = false;
            return;
          }
          const {error} = await supabaseClient.auth.signInWithPassword({
            email,
            password,
          });
          if (error) {
            loginMessage.textContent = error.message || "Erro ao fazer login.";
            loginMessage.hidden = false;
          } else {
            await checkSession();
          }
        });

      document
        .getElementById("logout-button")
        .addEventListener("click", async () => {
          await supabaseClient.auth.signOut();
          showLogin();
        });

      let adminProducts = [];
      document.getElementById("product-status-filter").addEventListener("change", renderAdminProducts);

      function renderAdminProducts() {
        const filter = document.getElementById("product-status-filter").value;
        const published = adminProducts.filter(p => p.is_active).length;
        document.getElementById("product-status-count").textContent =
          `${published} publicado(s) · ${adminProducts.length-published} pausado(s)`;
        productsBody.innerHTML = "";
        const visible = adminProducts.filter(p => filter === "all" || (filter === "active" ? p.is_active : !p.is_active));
        if (!visible.length) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = 6;
          td.textContent = adminProducts.length ? "Nenhum anúncio neste filtro." : "Nenhum produto cadastrado.";
          tr.appendChild(td);
          productsBody.appendChild(tr);
        }
        for (const prod of visible) {
          const tr = document.createElement("tr");
          if (!prod.is_active) tr.classList.add("product-row-paused");
          const add = (label, value) => {
            const td = document.createElement("td");
            td.setAttribute("data-label", label);
            td.textContent = value == null ? "" : String(value);
            tr.appendChild(td);
            return td;
          };
          add("ID", prod.id);
          add("Nome", prod.name);
          add("Preço", Number(prod.price || 0).toLocaleString("pt-BR", {style:"currency",currency:"BRL"}));
          add("Disponibilidade", prod.availability || "");
          const status = add("Anúncio", "");
          const badge = document.createElement("span");
          badge.className = `product-publish-badge ${prod.is_active ? "is-published" : "is-paused"}`;
          badge.textContent = prod.is_active ? "Publicado" : "Pausado";
          status.appendChild(badge);
          const actions = add("Ações", "");
          actions.className = "actions";
          const edit = document.createElement("a");
          edit.href = `admin-edit.html?id=${encodeURIComponent(prod.id)}`;
          edit.textContent = "Editar";
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = `product-toggle-button ${prod.is_active ? "pause" : "activate"}`;
          toggle.textContent = prod.is_active ? "Pausar anúncio" : "Reativar anúncio";
          toggle.addEventListener("click", () => toggleProductState(prod, toggle));
          actions.append(edit, toggle);
          productsBody.appendChild(tr);
        }
      }

      async function toggleProductState(prod, button) {
        const current = prod.is_active;
        const next = !current;
        button.disabled = true;
        button.textContent = "Salvando...";
        listMessage.hidden = true;
        try {
          const {data,error} = await supabaseClient.from("products")
            .update({is_active:next}).eq("id",prod.id).eq("is_active",current)
            .select("id,is_active").single();
          if(error) throw error;
          if(!data || data.is_active !== next) throw new Error("Atualize a página e tente novamente.");
          prod.is_active = next;
          renderAdminProducts();
          listMessage.textContent = next ? `“${prod.name}” reativado.` : `“${prod.name}” pausado.`;
          listMessage.className = "message success";
          listMessage.hidden = false;
        } catch(e) {
          button.disabled = false;
          button.textContent = current ? "Pausar anúncio" : "Reativar anúncio";
          listMessage.textContent = e.message || "Erro ao atualizar anúncio.";
          listMessage.className = "message error";
          listMessage.hidden = false;
        }
      }

      async function loadProducts() {
        listMessage.hidden = true;
        const {data,error} = await supabaseClient.from("products")
          .select("id,name,price,availability,is_active")
          .order("name", {ascending:true});
        if(error) {
          listMessage.textContent = error.message || "Erro ao carregar produtos.";
          listMessage.className = "message error";
          listMessage.hidden = false;
          return;
        }
        adminProducts = (data || []).map(p=>({...p,is_active:p.is_active!==false}));
        renderAdminProducts();
      }

      // Inicializa verificação
      checkSession();
    </script>
    <script>
      const adminMenuToggle = document.getElementById('menu-toggle');
      const adminNavLinks = document.querySelector('.nav-links');
      if (adminMenuToggle && adminNavLinks) {
        adminMenuToggle.addEventListener('click', () => {
          const opened = adminNavLinks.classList.toggle('show');
          adminMenuToggle.setAttribute('aria-expanded', String(opened));
        });
      }
    </script>
  </body>
</html>
