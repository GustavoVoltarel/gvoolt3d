    <main class="detail-page">

      <section id="product-detail-container" class="product-detail-container">

            <button class="nav-arrow prev" aria-label="Foto anterior">&#10094;</button>

            <button class="nav-arrow next" aria-label="Próxima foto">&#10095;</button>

        </div>

        <div class="product-info">
          <p class="eyebrow"><i class="fa-solid fa-bolt"></i> Produto GVolt 3D</p>

          <div class="rating" id="availability-info"></div>
          <p id="product-price" class="price"></p>
          <p id="product-description" class="description"></p>
          <table id="technical-specs-table" class="technical-specs"></table>

          <a id="buy-button" class="buy-button" href="#" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> Fazer pedido no WhatsApp

        </div>
      </section>

    <footer class="footer">
      <div class="footer-brand">
        <img src="https://ztrzwaosybnmzwjufqld.supabase.co/storage/v1/object/sign/Logo/gvolt-logo(2).jpeg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV85MGZhMzNjNC01ZjczLTQyYjAtYmE0NC0zYWQ0YTI4ZTllNTQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJMb2dvL2d2b2x0LWxvZ28oMikuanBlZyIsImlhdCI6MTc3ODE3MTUwMywiZXhwIjo0OTMxNzcxNTAzfQ.9eLch91nOTMxbWJrWqDTJldzdqiuiAJr6Z5tpAWeT2E" alt="Logo GVolt 3D" />
        <strong>GVolt <span>3D</span></strong>
      </div>
      <p>Soluções criativas em impressão 3D.</p>
      <a href="https://wa.me/5519995325891" target="_blank">
        <i class="fa-brands fa-whatsapp"></i> Fale conosco
      </a>
    </footer>

    <script>
      const supabaseClient = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_KEY,
      );

      function getParameterByName(name, url = window.location.href) {
        name = name.replace(/[\[\]]/g, "\$&");
        const regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)");
        const results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return "";
        return decodeURIComponent(results[2].replace(/\+/g, " "));
      }

      function formatPrice(value) {
        return Number(value || 0).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      const FALLBACK_IMAGE = "assets/fallback.svg";

      function normalizeImageValue(value) {
        if (!value) return [];

        if (Array.isArray(value)) {
          return value.flatMap((item) => normalizeImageValue(item));
        }

        if (typeof value === "object") {
          return normalizeImageValue(
            value.url || value.src || value.path || value.publicUrl || "",
          );
        }

        const text = String(value).trim();
        if (!text) return [];

        if (text.startsWith("[") || text.startsWith("{")) {
          try {
            return normalizeImageValue(JSON.parse(text));
          } catch {
            // Se não for JSON válido, continua tratando como texto comum.
          }
        }

        return text
          .split(",")
          .map((item) => item.trim().replace(/^['"]|['"]$/g, ""))
          .filter(Boolean);
      }

      function getProductImages(product) {
        const images = [
          ...normalizeImageValue(product.image),
          ...normalizeImageValue(product.images),
        ];

        return [...new Set(images)].filter(Boolean);
      }

      function setImageWithFallback(imageElement, src) {
        imageElement.onerror = () => {
          imageElement.onerror = null;
          imageElement.src = FALLBACK_IMAGE;
        };

        imageElement.src = src || FALLBACK_IMAGE;
      }

      function renderProductGallery(images) {
        const mainImageEl = document.getElementById("main-image");
        const thumbnailContainer = document.getElementById("thumbnail-container");
        const prev = document.querySelector(".nav-arrow.prev");
        const next = document.querySelector(".nav-arrow.next");
        let currentIndex = 0;

        const galleryImages = images.length ? images : [FALLBACK_IMAGE];

        function showImage(index) {
          currentIndex = index;
          setImageWithFallback(mainImageEl, galleryImages[index]);

          thumbnailContainer.querySelectorAll("img").forEach((thumb, idx) => {
            thumb.classList.toggle("active-thumb", idx === index);
          });
        }

        thumbnailContainer.innerHTML = "";

        galleryImages.forEach((imgSrc, idx) => {
          const thumb = document.createElement("img");
          setImageWithFallback(thumb, imgSrc);
          thumb.alt = "Miniatura " + (idx + 1);
          thumb.addEventListener("click", () => showImage(idx));
          thumbnailContainer.appendChild(thumb);
        });

        showImage(0);

        const hasMoreThanOneImage = galleryImages.length > 1;
        prev.style.display = hasMoreThanOneImage ? "grid" : "none";
        next.style.display = hasMoreThanOneImage ? "grid" : "none";
        thumbnailContainer.style.display = hasMoreThanOneImage ? "flex" : "none";

        prev.onclick = () =>
          showImage((currentIndex - 1 + galleryImages.length) % galleryImages.length);
        next.onclick = () => showImage((currentIndex + 1) % galleryImages.length);
      }

      function normalizeSpecs(product) {
        return product.technicalSpecs || product.technical_specs || null;
      }

      function renderTechnicalSpecs(product) {
        const techTable = document.getElementById("technical-specs-table");
        techTable.innerHTML = "";

        let specs = normalizeSpecs(product);
        if (!specs) return;

        if (typeof specs === "string") {
          try { specs = JSON.parse(specs); } catch { specs = null; }
        }

        if (!specs || typeof specs !== "object") return;

        const tbody = document.createElement("tbody");
        Object.entries(specs).forEach(([key, value]) => {
          const row = document.createElement("tr");
          const th = document.createElement("th");
          const td = document.createElement("td");
          th.textContent = key;
          td.textContent = value;
          row.appendChild(th);
          row.appendChild(td);
          tbody.appendChild(row);
        });
        techTable.appendChild(tbody);
      }

      function renderProduct(product) {
        document.title = `${product.name} | GVolt 3D`;
        document.getElementById("product-name").textContent = product.name || "Produto";
        document.getElementById("product-description").innerHTML = String(
          product.long_description || product.longDescription || product.description || "",
        ).replace(/\n/g, "<br>");
        document.getElementById("product-price").textContent = formatPrice(product.price);

        const availability = product.availability || "";
        const leadTime = product.lead_time_days || product.leadTimeDays || "";
        document.getElementById("availability-info").innerHTML = `
          <span style="color:${availability === "Em estoque" ? "#25d366" : "#f02dff"}">
            ● ${availability || "Sob consulta"}
          </span>
          ${leadTime ? ` • Prazo: ${leadTime} dias` : ""}
        `;

        renderTechnicalSpecs(product);
        renderProductGallery(getProductImages(product));

        const message = encodeURIComponent(
          `Olá! Quero comprar este produto 👇

${product.name}
${formatPrice(product.price)}

Você pode me passar mais detalhes?`,
        );
        document.getElementById("buy-button").href =
          "https://wa.me/5519995325891?text=" + message;
      }

      async function loadProduct() {
        const productId = getParameterByName("id");
        const container = document.getElementById("product-detail-container");

        if (!productId) {
          container.innerHTML = '<p class="empty-message">Produto não informado.</p>';
          return;
        }

        try {
          const { data, error } = await supabaseClient
            .from("products")
            .select("*")
            .eq("id", productId)
            .single();

          if (error) throw error;
          if (!data) throw new Error("Produto não encontrado.");
          renderProduct(data);
        } catch (err) {
          console.warn("Falha ao carregar produto via Supabase. Tentando products.json...", err);

          try {
            const response = await fetch("products.json");
            const products = await response.json();
            const product = products.find((item) => String(item.id) === String(productId));
            if (!product) throw new Error("Produto não encontrado.");
            renderProduct(product);
          } catch (error) {
            container.innerHTML = '<p class="empty-message">Produto não encontrado.</p>';
          }
        }
      }

      loadProduct();

      const menuToggle = document.getElementById("menu-toggle");
      const navLinks = document.querySelector(".nav-links");
      if (menuToggle && navLinks) {
        menuToggle.addEventListener("click", () => {
          navLinks.classList.toggle("show");
        });
      }
    </script>
  </body>
